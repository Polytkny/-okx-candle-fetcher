name: Fetch OKX candles

# 公開 repo 的 GitHub-hosted runner 免費不限量，不吃私有 repo 的分鐘數配額。
# 只打 OKX 公開行情端點，不需要任何 API 金鑰或 secrets。

on:
  workflow_dispatch:
    inputs:
      insts:
        description: "OKX 合約 ID，用逗號分隔可一次抓多個（一個 run 只推一次，避免並行 push 打架）"
        required: false
        default: "BTC-USDT-SWAP,ETH-USDT-SWAP,SOL-USDT-SWAP,XRP-USDT-SWAP"
      days:
        description: "往回抓幾天"
        required: false
        default: "720"
      base_bar:
        description: "基礎K棒週期。趨勢策略用20日通道，30m 跑兩年就夠；要測網格才需要 3m"
        required: false
        default: "30m"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch every instrument
        env:
          INSTS: ${{ github.event.inputs.insts || 'BTC-USDT-SWAP,ETH-USDT-SWAP,SOL-USDT-SWAP,XRP-USDT-SWAP' }}
          DAYS: ${{ github.event.inputs.days || '720' }}
          BAR: ${{ github.event.inputs.base_bar || '30m' }}
        run: |
          mkdir -p data
          IFS=',' read -ra LIST <<< "$INSTS"
          for INST in "${LIST[@]}"; do
            INST=$(echo "$INST" | xargs)          # 去掉前後空白
            [ -z "$INST" ] && continue
            echo "::group::$INST"
            # 單一標的失敗不要中斷整批，其他標的照抓
            if python3 okx_fetch.py --inst "$INST" --days "$DAYS" --bar "$BAR"; then
              gzip -c "ohlc_${BAR}_raw.csv" > "data/${INST}_${BAR}_${DAYS}d.csv.gz"
              echo "✅ $INST -> data/${INST}_${BAR}_${DAYS}d.csv.gz"
            else
              echo "⚠️ $INST 抓取失敗，跳過"
            fi
            echo "::endgroup::"
          done
          ls -la data/

      - name: Commit CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no change" || \
            git commit -m "data: ${{ github.event.inputs.insts }} ${{ github.event.inputs.base_bar }} ${{ github.event.inputs.days }}d (snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin main || true
          git push origin HEAD:main
